<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting &mdash; General Inquiry</title>
  <meta http-equiv="refresh" content="0; url=./general/confirm.html">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Dummy Form</h1>
  </header>

  <main class="container">
    <p>Redirecting to the <a href="./general/confirm.html">General Inquiry</a> confirm page&hellip;</p>
  </main>

  <script>
    // Old root URLs now live under /general/. Carry over data saved before the
    // form became multi-case, then forward.
    try {
      var legacy = sessionStorage.getItem('inquiry-form-data');
      if (legacy && !sessionStorage.getItem('inquiry-form-data:general')) {
        sessionStorage.setItem('inquiry-form-data:general', legacy);
      }
    } catch (err) {
      // Storage unavailable — the confirm page will redirect to the form.
    }
    window.location.replace('./general/confirm.html');
  </script>
</body>
</html>
