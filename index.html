<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiry Form</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Inquiry Form</h1>
  </header>

  <main class="container">
    <form id="inquiry-form">
      <div class="field-row">
        <div class="field">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="firstName" required>
        </div>
        <div class="field">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="lastName" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <fieldset class="field">
        <legend>Phone</legend>
        <div class="phone-group">
          <input type="tel" id="phone-1" name="phone1" required
                 inputmode="numeric" pattern="[0-9]+" autocomplete="off"
                 aria-label="Phone, first part">
          <span class="phone-sep" aria-hidden="true">&ndash;</span>
          <input type="tel" id="phone-2" name="phone2" required
                 inputmode="numeric" pattern="[0-9]+" autocomplete="off"
                 aria-label="Phone, second part">
          <span class="phone-sep" aria-hidden="true">&ndash;</span>
          <input type="tel" id="phone-3" name="phone3" required
                 inputmode="numeric" pattern="[0-9]+" autocomplete="off"
                 aria-label="Phone, third part">
        </div>
      </fieldset>

      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Confirm</button>
    </form>
  </main>

  <script src="js/form.js"></script>
</body>
</html>
